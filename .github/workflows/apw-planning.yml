name: APW planning integrity
on:
  push:
    branches: [main, 'axel/**']
  pull_request:
  workflow_dispatch:
jobs:
  planning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checkpoint numbering and quality docs
        run: python tools/verify_apw_planning.py
