name: Godot Combat Tests

on:
  push:
    branches:
      - 'axel/**'
      - 'agent/**'
  pull_request:
    branches:
      - 'axel/**'
      - 'agent/**'
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-tests:
    name: Headless combat, arcade and DDT boot tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: lihop/setup-godot@v3
        with:
          version: 4.7.2-stable

      - name: Confirm Godot version
        run: godot --version

      - name: Import project assets
        run: godot --headless --path . --import

      - name: Run combat rules tests
        id: rules
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_combat_rules.gd 2>&1 | tee rules.log
          grep -qE 'APW combat rules: [0-9]+ passed, 0 failed' rules.log || { echo '::error::rules suite missing clean result line'; exit 1; }

      - name: Run combat AI tests
        id: ai
        shell: bash
        if: always()
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_combat_ai.gd 2>&1 | tee ai.log
          grep -qE 'APW AI: [0-9]+ scenarios, [0-9]+ checks passed, 0 failed' ai.log || { echo '::error::AI suite missing clean result line'; exit 1; }

      - name: Boot arcade scene headless
        id: arcade
        if: always()
        shell: bash
        run: |
          set -o pipefail
          timeout 30 godot --headless --path . res://combat_arcade.tscn --quit 2>&1 | tee arcade.log
          if grep -qE 'SCRIPT ERROR|Parse Error|Cannot open|Failed to load' arcade.log; then
            echo '::error::arcade scene reported an error'
            exit 1
          fi

      - name: Boot DDT prototype headless
        id: proto
        if: always()
        shell: bash
        run: |
          set -o pipefail
          timeout 30 godot --headless --path . res://main.tscn --quit 2>&1 | tee proto.log
          if grep -qE 'SCRIPT ERROR|Parse Error|Cannot open|Failed to load' proto.log; then
            echo '::error::DDT scene reported an error'
            exit 1
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-logs
          path: |
            rules.log
            ai.log
            arcade.log
            proto.log
          if-no-files-found: warn

      - name: Summarize results
        if: always()
        shell: bash
        run: |
          {
            echo '## Godot headless combat and scene boot tests'
            echo ''
            echo 'Rules: ${{ steps.rules.outcome }}'
            echo 'AI: ${{ steps.ai.outcome }}'
            echo 'Arcade boot: ${{ steps.arcade.outcome }}'
            echo 'DDT boot: ${{ steps.proto.outcome }}'
            echo ''
            echo '### Rules log'
            echo '```'
            cat rules.log 2>/dev/null || echo '(no log)'
            echo '```'
            echo '### AI log'
            echo '```'
            cat ai.log 2>/dev/null || echo '(no log)'
            echo '```'
            echo '### Arcade boot log'
            echo '```'
            cat arcade.log 2>/dev/null || echo '(no log)'
            echo '```'
            echo '### DDT boot log'
            echo '```'
            cat proto.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
